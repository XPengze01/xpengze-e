# 自动更新配置 (如需启用请取消注释)
auto_update:
url: https://raw.githubusercontent.com/XPengze01/xpengze-e/main/xpengze-e.yaml
interval: 86400

ipv6: false
http_port: 3080
socks_port: 3090
allow_external_connections: false
vif_only: true
block_quic: true
hide_vpn_icon: false
hijack_dns:
- '*:53'
geoip_db_url: https://github.com/xream/geoip/releases/latest/download/ipinfo.country.mmdb
asn_db_url: https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-ASN.mmdb
proxy_latency_test_url: http://www.gstatic.com/generate_204
direct_latency_test_url: http://connectivitycheck.platform.hicloud.com/generate_204
compat_route: true
dns:
  bootstrap:
    - system
    - 223.5.5.5
    - 119.29.29.29
  upstreams:
    System:
    - system
    China_DNS:
    - 223.5.5.5
    - 119.29.29.29
    Global_DNS:
    - https://cloudflare-dns.com/dns-query
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
    Tencent_DNS:
    - https://doh.pub/dns-query
    - 119.29.29.29
  forward:
  - wildcard:
      match: '*.local'
      value: System
  - wildcard:
      match: '*.lan'
      value: System
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/WeChat/WeChat.list
      value: Tencent_DNS
      disabled: false
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/ChinaMax/ChinaMax_Domain.list
      value: China_DNS
  - wildcard:
      match: '*'
      value: Global_DNS
  hosts:
    iosapps.itunes.apple.com:
    - iosapps.itunes.apple.com.download.ks-cdn.com
  public_ip_lookup_url: https://ifconfig.me/ip
proxies:
- vless:
    name: xxxxxxxxx
    server: xxxxxxxxx
    port: 22804
    user_id: xxxxxxxxx
    tfo: false
    udp_relay: true
    flow: xtls-rprx-vision
    transport:
      tls:
        sni: cdn.bizibly.com
        reality:
          public_key: 这里是密码
          short_id: a4e957
        skip_tls_verify: false
    prev_hop: 日本节点
policy_groups:
- external:
    name: Subscribe
    type: select
    urls:
    - 订阅链接1
    - 订阅链接2
    - 订阅链接3
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Static.png
    hidden: true
- select:
    name: PROXY
    policies:
    - NTT isp
    - 自动选择
    - 低倍率节点
    - 香港节点
    - 台湾节点
    - 日本节点
    - 新加坡节点
    - 美国节点
    - 其他节点
    flatten: false
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Final.png
    hidden: false
- auto_test:
    name: 自动选择
    policies:
    - Subscribe
    flatten: true
    tolerance: 100
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Auto.png
- select:
    name: 手动选择
    policies:
    - Subscribe
    flatten: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Rocket.png
    hidden: false
- auto_test:
    name: 低倍率节点
    policies:
    - Subscribe
    flatten: true
    filter: \d+\.\d+
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Direct.png
    hidden: true
- fallback:
    name: 美国家宽isp
    policies:
    - Subscribe
    flatten: true
    filter: ^(?=.*家宽)(?=.*(美国|美國|\bUS\b|USA|United\s?States)).*
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Back.png
    hidden: false
- select:
    name: Emby
    policies:
    - DIRECT
    - 低倍率节点
    flatten: false
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Emby.png
    hidden: false
- auto_test:
    name: 香港节点
    policies:
    - Subscribe
    flatten: true
    filter: ^(?=.*((?i)🇭🇰|香港|(\b(HK|Hong)\b)))(?!.*((?i)回国|校园|游戏|(\b(GAME)\b))).*$
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png
    hidden: false
- auto_test:
    name: 台湾节点
    policies:
    - Subscribe
    flatten: true
    filter: ^(?=.*((?i)🇹🇼|台湾|(\b(TW|Tai|Taiwan)\b)))(?!.*((?i)回国|校园|游戏|(\b(GAME)\b))).*$
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Taiwan.png
    hidden: false
- auto_test:
    name: 日本节点
    policies:
    - Subscribe
    flatten: true
    filter: ^(?=.*((?i)🇯🇵|日本|(\b(JP|Japan)\b)))(?!.*((?i)回国|校园|游戏|(\b(GAME)\b))).*$
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Japan.png
    hidden: false
- auto_test:
    name: 新加坡节点
    policies:
    - Subscribe
    flatten: true
    filter: ^(?=.*((?i)🇸🇬|新加坡|狮|(\b(SG|Singapore)\b)))(?!.*((?i)回国|校园|游戏|(\b(GAME)\b))).*$
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Singapore.png
    hidden: false
- auto_test:
    name: 美国节点
    policies:
    - Subscribe
    flatten: true
    filter: ^(?=.*((?i)🇺🇸|美国|(\b(US|United States)\b)))(?!.*((?i)回国|校园|游戏|(\b(GAME)\b))).*$
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png
    hidden: false
- select:
    name: 其他节点
    policies:
    - Subscribe
    flatten: true
    filter: ^((?!香港|HK|Hong|🇭🇰|台湾|TW|Taiwan|Tai|🇹🇼|日本|JP|Japan|🇯🇵|新加坡|狮城|SG|Singapore|🇸🇬|美国|US|United States|America|🇺🇸).)*$
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/World_Map.png
- select:
    name: AI服务
    policies:
    - 美国家宽isp
    - 美国节点
    - 新加坡节点
    - PROXY
    flatten: false
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Bot.png
