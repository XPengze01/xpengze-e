# 闲鱼 Lite V4.2.0：在 V4.1.1 基础上强化开屏响应，计数归零、增加 splash.config 和广告联盟域名。
# 首页和详情规则与 V4.1.1 完全一致；不拦截 HTTPDNS / AMDC / 支付、聊天及交易接口。
# 请只启用一套闲鱼去广告模块，并停用旧 V4.1.1 与 V4.2 JS 测试版。
# 注意：域名级 REJECT 作用于所有 App，可能影响使用相同广告 SDK 的其他应用。
name: 闲鱼去广告 Lite V4.2.0（开屏强化）
description: 清除开屏广告池及数字展示次数，屏蔽3个广告联盟域名；首页和商品详情仅过滤明确广告；不修改搜索、聊天、订单、支付或 HTTPDNS/AMDC。
author: custom based on ddgksf2013, KeLee, skernelx, ShiinaWong, y0unge
homepage: https://github.com/XPengze01/xpengze-e
rules:
- domain:
    match: ssp.iytcdn.com
    policy: REJECT
- domain:
    match: bid.ad-scope.com.cn
    policy: REJECT
- domain:
    match: sdk.beizi.biz
    policy: REJECT
body_rewrites:
- response_jq:
    match: '^https?://(?:acs|g-acs|gw)\.m\.(?:goofish|taobao)\.com/(?:gw|h5)/mtop\.taobao\.idlecommerce\.splash\.(?:async\.)?ads(?:/|\?|$)'
    filter: |-
      def zero_counts:
        walk(
          if type == "object" then
            with_entries(
              if (.key | test("(max|left)showcount|showtimes"; "i")) and ((.value | type) == "number")
              then .value = 0
              else . end)
          else . end);
      if (.data | type) == "object" then
        .data |= (.adMap = {} | .cacheAdInfo = null | .realTimeAd = null | zero_counts)
      else . end
- response_jq:
    match: '^https?://(?:acs|g-acs|gw)\.m\.(?:goofish|taobao)\.com/(?:gw|h5)/mtop\.taobao\.idlecommerce\.splash\.config(?:/|\?|$)'
    filter: |-
      def zero_counts:
        walk(
          if type == "object" then
            with_entries(
              if (.key | test("(max|left)showcount|showtimes"; "i")) and ((.value | type) == "number")
              then .value = 0
              else . end)
          else . end);
      if (.data | type) == "object" then
        .data |= zero_counts
      else . end
- response_jq:
    match: ^https?://(acs|g-acs|gw)\.m\.(goofish|taobao)\.com/(gw|h5)/mtop\.taobao\.(?:idlehome\.home\.(?:firstdata|nextfresh|newitem\.page)|idle\.home\.(?:firstdata|nextfresh|nextnearby)|idle\.local\.home)(?:/|\?|$)
    filter: |-
      def v($p): try getpath($p) catch null;
      def flagged: . == true or . == 1 or . == "true" or . == "1";
      def adtype: if type == "string" then
        (ascii_downcase | IN("ad", "ads", "mamaad", "advertisement", "feed_ad", "native_ad"))
        else false end;
      def explicit_ad:
        ([v(["isAd"]), v(["is_ad"]), v(["isAliMaMaAD"]),
          v(["data", "isAd"]), v(["data", "is_ad"]), v(["data", "isAliMaMaAD"]),
          v(["cardData", "isAliMaMaAD"]),
          v(["data", "item", "main", "exContent", "isAliMaMaAD"])]
         | any(flagged))
        or
        ([v(["bizType"]), v(["cardType"]), v(["modelType"]),
          v(["data", "bizType"]), v(["data", "cardType"]),
          v(["cardData", "bizType"]), v(["cardData", "cardType"]),
          v(["data", "clickParam", "args", "cardType"]),
          v(["data", "item", "main", "clickParam", "args", "biz_type"]),
          v(["data", "item", "main", "exContent", "dislikeFeedback", "clickParam", "args", "bizType"]),
          v(["template", "cardEnum"])]
         | any(adtype));
      if (.ret | type) == "array" and any(.ret[]; (type == "string" and startswith("SUCCESS::")) | not) then .
      elif (.data | type) != "object" then .
      else
        if (.data.sections | type) == "array" then
          .data.sections |= map(select(explicit_ad | not))
        else . end
        | if (.data.items | type) == "array" then
          .data.items |= map(select(explicit_ad | not))
        else . end
        | if (.data.cardList | type) == "array" then
          .data.cardList |= map(select(explicit_ad | not))
        else . end
      end
- response_jq:
    match: ^https?://(acs|g-acs|gw)\.m\.(goofish|taobao)\.com/(gw|h5)/mtop\.taobao\.idle\.item\.recommend(?:\.list)?(?:/|\?|$)
    filter: |-
      def v($p): try getpath($p) catch null;
      def flagged: . == true or . == 1 or . == "true" or . == "1";
      def adtype: if type == "string" then
        (ascii_downcase | IN("ad", "ads", "mamaad", "advertisement", "feed_ad", "native_ad"))
        else false end;
      def explicit_ad:
        ([v(["isAd"]), v(["is_ad"]), v(["isAliMaMaAD"]),
          v(["data", "isAd"]), v(["data", "is_ad"]), v(["data", "isAliMaMaAD"]),
          v(["cardData", "isAliMaMaAD"]),
          v(["data", "item", "main", "exContent", "isAliMaMaAD"])]
         | any(flagged))
        or
        ([v(["bizType"]), v(["cardType"]), v(["modelType"]),
          v(["data", "bizType"]), v(["data", "cardType"]),
          v(["cardData", "bizType"]), v(["cardData", "cardType"]),
          v(["data", "clickParam", "args", "cardType"]),
          v(["data", "item", "main", "clickParam", "args", "biz_type"]),
          v(["data", "item", "main", "exContent", "dislikeFeedback", "clickParam", "args", "bizType"]),
          v(["template", "cardEnum"])]
         | any(adtype));
      if (.ret | type) == "array" and any(.ret[]; (type == "string" and startswith("SUCCESS::")) | not) then .
      elif (.data | type) != "object" then .
      else
        if (.data.cardList | type) == "array" then
          .data.cardList |= map(select(explicit_ad | not))
        else . end
      end
mitm:
  hostnames:
    includes:
    - acs.m.goofish.com
    - g-acs.m.goofish.com
    - gw.m.goofish.com
    - acs.m.taobao.com
    - g-acs.m.taobao.com
    - gw.m.taobao.com
