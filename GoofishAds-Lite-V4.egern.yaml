# 闲鱼 Lite V4：不拦截 HTTPDNS / AMDC / 支付、聊天及交易接口。
# 与其它闲鱼去广告模块同时启用可能互相覆盖，请只启用一套。
name: 闲鱼去广告 Lite V4.1（无失效脚本）
description: 仅清除开屏广告池、首页与商品详情中明确标记的广告卡；不依赖已失效的远程 JS，不修改搜索、聊天、订单、支付或 HTTPDNS/AMDC。
author: custom based on ddgksf2013, KeLee, skernelx, ShiinaWong
homepage: https://github.com/XPengze01/xpengze-e
body_rewrites:
- response_jq:
    match: '^https?://(?:acs|g-acs|gw)\\.m\\.(?:goofish|taobao)\\.com/(?:gw|h5)/mtop\\.taobao\\.idlecommerce\\.splash\\.(?:async\\.)?ads(?:/|\\?|$)'
    filter: >-
      if (.data | type) == "object" then
        .data |= (.adMap = {} | .cacheAdInfo = null | .realTimeAd = null)
      else . end
- response_jq:
    match: ^https?://(acs|g-acs|gw)\.m\.(goofish|taobao)\.com/(gw|h5)/mtop\.taobao\.(?:idlehome\.home\.(?:nextfresh|newitem\.page)|idle\.home\.(?:firstdata|nextfresh)|idle\.local\.home)(?:/|\?|$)
    filter: |-
      def v($p): try getpath($p) catch null;
      def flagged: . == true or . == 1 or . == "true" or . == "1";
      def adtype: if type == "string" then
        (ascii_downcase | IN("ad", "ads", "mamaad", "advertisement", "feed_ad", "native_ad"))
        else false end;
      def explicit_ad:
        ([v(["isAd"]), v(["is_ad"]), v(["isAliMaMaAD"]),
          v(["data", "isAd"]), v(["data", "is_ad"]), v(["data", "isAliMaMaAD"]),
          v(["cardData", "isAliMaMaAD"]),
          v(["data", "item", "main", "exContent", "isAliMaMaAD"])]
         | any(flagged))
        or
        ([v(["bizType"]), v(["cardType"]), v(["modelType"]),
          v(["data", "bizType"]), v(["data", "cardType"]),
          v(["cardData", "bizType"]), v(["cardData", "cardType"]),
          v(["data", "clickParam", "args", "cardType"]),
          v(["data", "item", "main", "clickParam", "args", "biz_type"]),
          v(["data", "item", "main", "exContent", "dislikeFeedback", "clickParam", "args", "bizType"]),
          v(["template", "cardEnum"])]
         | any(adtype));
      if (.ret | type) == "array" and any(.ret[]; (type == "string" and startswith("SUCCESS::")) | not) then .
      elif (.data | type) != "object" then .
      else
        if (.data.sections | type) == "array" then
          .data.sections |= map(select(explicit_ad | not))
        else . end
      end
- response_jq:
    match: ^https?://(acs|g-acs|gw)\.m\.(goofish|taobao)\.com/(gw|h5)/mtop\.taobao\.idle\.item\.recommend(?:\.list)?(?:/|\?|$)
    filter: |-
      def v($p): try getpath($p) catch null;
      def flagged: . == true or . == 1 or . == "true" or . == "1";
      def adtype: if type == "string" then
        (ascii_downcase | IN("ad", "ads", "mamaad", "advertisement", "feed_ad", "native_ad"))
        else false end;
      def explicit_ad:
        ([v(["isAd"]), v(["is_ad"]), v(["isAliMaMaAD"]),
          v(["data", "isAd"]), v(["data", "is_ad"]), v(["data", "isAliMaMaAD"]),
          v(["cardData", "isAliMaMaAD"]),
          v(["data", "item", "main", "exContent", "isAliMaMaAD"])]
         | any(flagged))
        or
        ([v(["bizType"]), v(["cardType"]), v(["modelType"]),
          v(["data", "bizType"]), v(["data", "cardType"]),
          v(["cardData", "bizType"]), v(["cardData", "cardType"]),
          v(["data", "clickParam", "args", "cardType"]),
          v(["data", "item", "main", "clickParam", "args", "biz_type"]),
          v(["data", "item", "main", "exContent", "dislikeFeedback", "clickParam", "args", "bizType"]),
          v(["template", "cardEnum"])]
         | any(adtype));
      if (.ret | type) == "array" and any(.ret[]; (type == "string" and startswith("SUCCESS::")) | not) then .
      elif (.data | type) != "object" then .
      else
        if (.data.cardList | type) == "array" then
          .data.cardList |= map(select(explicit_ad | not))
        else . end
      end
mitm:
  hostnames:
    includes:
    - acs.m.goofish.com
    - g-acs.m.goofish.com
    - gw.m.goofish.com
    - acs.m.taobao.com
    - g-acs.m.taobao.com
    - gw.m.taobao.com
