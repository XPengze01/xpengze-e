name: 小红书 Lite V2.6（精准去广告增强）
description: 保留 V2.5 评论 red_id、图片和视频去水印；定向清理明确广告接口、视频广告信息、消息推广与横幅，不改正常搜索、聊天及店铺交易。
author: Custom Lite V2.6 (fmz200-inspired; references rednote-egern)
homepage: https://github.com/XPengze01/xpengze-e

# 只拒绝已知专用广告媒体域名，不拦截通用图片/视频 CDN。
rules:
  - domain:
      match: ads-img-qc.xhscdn.com
      policy: REJECT
  - domain:
      match: ads-img-al.xhscdn.com
      policy: REJECT
  - domain:
      match: ads-img-bak.xhscdn.com
      policy: REJECT
  - domain:
      match: ads-video-al.xhscdn.com
      policy: REJECT
  - domain:
      match: ads-video-qc.xhscdn.com
      policy: REJECT
  - domain:
      match: t-ads.xiaohongshu.com
      policy: REJECT

# 严格限定接口范围：评论去水印只处理评论列表，不触及私信、用户主页、店铺交易。
# 对齐 fmz200 的 tiny-gif：Egern 官方 http://reject-img/ 返回真正的 1×1 透明 GIF，
# 避免旧版 map_locals 使用空字节却声明 image/gif 的无效响应。
url_rewrites:
  - match: '^https?://ci\.(?:xiaohongshu|rnote)\.com/system_config/watermark(?:/|\?|$)'
    location: http://reject-img/
  - match: '^https?://(?:edith|www)\.(?:xiaohongshu|rnote)\.com/api/sns/v1/system(?:/|_)config/watermark(?:/|\?|$)'
    location: http://reject-img/

scriptings:
  - http_response:
      name: 小红书 Lite V2.6 选择性净化
      match: '^https?://(edith|rec|www)\.(xiaohongshu|rnote)\.com/api/sns/(?:v[0-9]+/(?:system_service/(?:splash_config|splash_async_optimization|splash_online_decision|config)|homefeed|followfeed|user/followings/followfeed|note/(?:imagefeed|feed|tabfeed|redtube|videofeed|detailfeed(?:/preload)?|widgets|comment/(?:list|sub_comments)|live_photo/save|video/save))|v1/interaction/comment/video/download)(?:/?(?:[?#]|$))'
      script_url: https://raw.githubusercontent.com/XPengze01/xpengze-e/main/Xiaohongshu-Lite-V2-Egern/Xiaohongshu-Lite-V2.js
      update_interval: 3600
      timeout: 15
      body_required: true
      max_size: 8388608

  - http_response:
      name: 小红书 Lite V2.6 搜索结果与推广横幅
      match: '^https?://(?:edith|so|search)\.(?:xiaohongshu|rnote)\.com/api/sns/v[0-9]+/search/(?:notes|banner_list)(?:/?(?:[?#]|$))'
      script_url: https://raw.githubusercontent.com/XPengze01/xpengze-e/main/Xiaohongshu-Lite-V2-Egern/Xiaohongshu-Lite-V2.js
      update_interval: 3600
      timeout: 15
      body_required: true
      max_size: 8388608


  - http_response:
      name: 小红书 Lite V2.6 广告资源与视频广告
      match: '^https?://(?:edith|www)\\.(?:xiaohongshu|rnote)\\.com/api/sns/v[0-9]+/(?:ads/resource|tag/ads_engage|content/video/get_ads_info)(?:/?(?:[?#]|$))'
      script_url: https://raw.githubusercontent.com/XPengze01/xpengze-e/main/Xiaohongshu-Lite-V2-Egern/Xiaohongshu-Lite-V2.js
      update_interval: 3600
      timeout: 15
      body_required: true
      max_size: 8388608

  - http_response:
      name: 小红书 Lite V2.6 消息页商业与活动推广
      match: '^https?://(?:edith|www)\\.(?:xiaohongshu|rnote)\\.com/api/sns/v[0-9]+/message/detect(?:/?(?:[?#]|$))'
      script_url: https://raw.githubusercontent.com/XPengze01/xpengze-e/main/Xiaohongshu-Lite-V2-Egern/Xiaohongshu-Lite-V2.js
      update_interval: 3600
      timeout: 15
      body_required: true
      max_size: 8388608

  - http_response:
      name: 小红书 Lite V2.6 私信推广横幅
      match: '^https?://(?:edith|www)\\.(?:xiaohongshu|rnote)\\.com/api/im/v[0-9]+/get_banner_list(?:/?(?:[?#]|$))'
      script_url: https://raw.githubusercontent.com/XPengze01/xpengze-e/main/Xiaohongshu-Lite-V2-Egern/Xiaohongshu-Lite-V2.js
      update_interval: 3600
      timeout: 15
      body_required: true
      max_size: 8388608

mitm:
  hostnames:
    includes:
      - edith.xiaohongshu.com
      - rec.xiaohongshu.com
      - www.xiaohongshu.com
      - edith.rnote.com
      - rec.rnote.com
      - www.rnote.com
      - so.xiaohongshu.com
      - search.xiaohongshu.com
      - so.rnote.com
      - search.rnote.com
      - ci.xiaohongshu.com
      - ci.rnote.com
