name: 小红书 Lite V2.1（Egern 原生增强）
description: 开屏、首页、关注、搜索结果和笔记组件仅清理明确广告；保留图片视频去水印与保存。不删正常搜索结果、购物、直播、聊天和普通推荐。
author: Custom Lite V2.1 (based on fmz200; references rednote-egern)
homepage: https://github.com/XPengze01/xpengze-e

# 只拒绝已知专用广告媒体域名，不拦截通用图片/视频 CDN。
rules:
  - domain:
      match: ads-img-qc.xhscdn.com
      policy: REJECT
  - domain:
      match: ads-img-al.xhscdn.com
      policy: REJECT
  - domain:
      match: ads-img-bak.xhscdn.com
      policy: REJECT
  - domain:
      match: ads-video-al.xhscdn.com
      policy: REJECT
  - domain:
      match: ads-video-qc.xhscdn.com
      policy: REJECT
  - domain:
      match: t-ads.xiaohongshu.com
      policy: REJECT

# 严格限定可修改的业务接口；搜索仅拦截 /search/notes 的明确广告，不触碰私信、购物或其他搜索服务。
scriptings:
  - http_response:
      name: 小红书 Lite V2.1 选择性净化
      match: '^https?://(edith|rec|www)\.(xiaohongshu|rnote)\.com/api/sns/(?:v[0-9]+/(?:system_service/(?:splash_config|splash_async_optimization|splash_online_decision)|homefeed|followfeed|user/followings/followfeed|note/(?:imagefeed|feed|videofeed|detailfeed(?:/preload)?|widgets|comment/(?:list|sub_comments)|live_photo/save|video/save))|v1/interaction/comment/video/download)(?:/?(?:[?#]|$))'
      script_url: https://raw.githubusercontent.com/XPengze01/xpengze-e/main/Xiaohongshu-Lite-V2-Egern/Xiaohongshu-Lite-V2.js
      update_interval: 3600
      timeout: 15
      body_required: true
      max_size: 8388608

  - http_response:
      name: 小红书 Lite V2.1 搜索结果明确广告
      match: '^https?://(?:edith|so|search)\.(?:xiaohongshu|rnote)\.com/api/sns/v[0-9]+/search/notes(?:/?(?:[?#]|$))'
      script_url: https://raw.githubusercontent.com/XPengze01/xpengze-e/main/Xiaohongshu-Lite-V2-Egern/Xiaohongshu-Lite-V2.js
      update_interval: 3600
      timeout: 15
      body_required: true
      max_size: 8388608

mitm:
  hostnames:
    includes:
      - edith.xiaohongshu.com
      - rec.xiaohongshu.com
      - www.xiaohongshu.com
      - edith.rnote.com
      - rec.rnote.com
      - www.rnote.com
      - so.xiaohongshu.com
      - search.xiaohongshu.com
      - so.rnote.com
      - search.rnote.com
