
name: 闲鱼去广告 Lite V2
description: 仅处理开屏广告、首页明确广告、商品详情明确广告；优先保障正常使用
author: Custom based on ddgksf2013 and skernelx

# ==================================
# 1. 开屏广告：新版响应体处理
# ==================================

scriptings:
  - http_response:
      name: 闲鱼开屏广告处理
      match: '^https?://(acs|g-acs|gw)\.m\.(goofish|taobao)\.com/(gw|h5)/mtop\.taobao\.idlecommerce\.splash\.(?:async\.)?ads(?:/|\?|$)'
      script_url: https://raw.githubusercontent.com/skernelx/SurgeScripts/e186be665455844fdd5c31df201205fc5cb355a0/xianyu/xianyu-ad-block.egern.js
      body_required: true
      max_size: 2097152
      timeout: 30
      env:
        NOTIFY_ONCE: 'true'

  # 手动诊断，不影响正常请求
  - generic:
      name: 闲鱼开屏广告诊断
      script_url: https://raw.githubusercontent.com/skernelx/SurgeScripts/e186be665455844fdd5c31df201205fc5cb355a0/xianyu/xianyu-ad-block.egern.js
      timeout: 30

# ==================================
# 2. 首页及商品详情：精简广告过滤
# ==================================

body_rewrites:

  # 首页：只移除明确标记为 mamaAD 的广告
  - response_jq:
      match: '^https?://(g-)?acs\.m\.goofish\.com/gw/mtop\.taobao\.idlehome\.home\.nextfresh(?:/|\?|$)'
      filter: 'if (.data.sections | type) == "array" then .data.sections |= map(select((.data.bizType != "mamaAD") and (.cardData.bizType != "mamaAD"))) else . end'

  # 商品详情：只移除明确标记的广告卡片
  - response_jq:
      match: '^https?://(g-)?acs\.m\.goofish\.com/gw/mtop\.taobao\.idle\.item\.recommend(?:/|\?|$)'
      filter: 'if (.data.cardList | type) == "array" then .data.cardList |= map(select(.cardData.bizType != "mamaAD")) else . end'

# ==================================
# 3. MITM：覆盖必要的业务网关
# ==================================

mitm:
  hostnames:
    includes:
      - acs.m.goofish.com
      - g-acs.m.goofish.com
      - gw.m.goofish.com
      - acs.m.taobao.com
      - g-acs.m.taobao.com
      - gw.m.taobao.com
